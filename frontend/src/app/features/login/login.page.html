<div class="login-backdrop" aria-hidden="true"></div>

<mat-card class="login-card" appearance="outlined">
  <div class="login-brand">
    <img class="login-logo" src="icon.svg" alt="" width="56" height="56" />
    <h1 class="login-app-name" i18n="@@appName">Collage-o-mat</h1>
    <p class="login-subtitle" i18n="@@login.title">Sign in</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-card-content class="login-fields">
      <mat-form-field>
        <mat-label i18n="@@login.username">Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" required />
        @if (form.controls.username.hasError('required')) {
          <mat-error i18n="@@login.usernameRequired">Username is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label i18n="@@login.password">Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
        />
        @if (form.controls.password.hasError('required')) {
          <mat-error i18n="@@login.passwordRequired">Password is required</mat-error>
        }
      </mat-form-field>

      @if (error(); as message) {
        <p class="login-error" role="alert">{{ message }}</p>
      }
    </mat-card-content>

    <mat-card-actions class="login-actions">
      <button class="login-submit" matButton="filled" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner class="login-spinner" diameter="18" />
        }
        <span i18n="@@login.submit">Sign in</span>
      </button>
    </mat-card-actions>
  </form>

  <app-copyright-notice class="login-copyright" />

</mat-card>
