<mat-card class="login-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title i18n="@@login.title">Sign in</mat-card-title>
  </mat-card-header>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-card-content class="login-fields">
      <mat-form-field>
        <mat-label i18n="@@login.username">Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" required />
        @if (form.controls.username.hasError('required')) {
          <mat-error i18n="@@login.usernameRequired">Username is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label i18n="@@login.password">Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
        />
        @if (form.controls.password.hasError('required')) {
          <mat-error i18n="@@login.passwordRequired">Password is required</mat-error>
        }
      </mat-form-field>

      @if (error(); as message) {
        <p class="login-error" role="alert">{{ message }}</p>
      }
    </mat-card-content>

    <mat-card-actions align="end">
      <button matButton="filled" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner class="login-spinner" diameter="18" />
        }
        <span i18n="@@login.submit">Sign in</span>
      </button>
    </mat-card-actions>
  </form>
</mat-card>
