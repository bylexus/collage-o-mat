<section class="panel-section">
  <h3 class="panel-heading" i18n="@@editor.settings.pageHeading">Page</h3>
  <app-page-settings-section [page]="settings().page" (pageChange)="update({ page: $event })" />
</section>

<section class="panel-section">
  <h3 class="panel-heading" i18n="@@editor.settings.appearanceHeading">Appearance</h3>
  <app-appearance-settings-section
    [background]="settings().background"
    [backgroundImageUrl]="backgroundImageUrl()"
    [defaultBorder]="settings().defaultBorder"
    [defaultShadow]="settings().defaultShadow"
    [hasBorderOverrides]="hasBorderOverrides()"
    [hasShadowOverrides]="hasShadowOverrides()"
    (backgroundChange)="update({ background: $event })"
    (backgroundPreview)="preview({ background: $event })"
    (defaultBorderChange)="update({ defaultBorder: $event })"
    (defaultBorderPreview)="preview({ defaultBorder: $event })"
    (defaultShadowChange)="update({ defaultShadow: $event })"
    (defaultShadowPreview)="preview({ defaultShadow: $event })"
    (applyBorderToAll)="applyBorderToAll.emit()"
    (applyShadowToAll)="applyShadowToAll.emit()"
  />
</section>

<section class="panel-section">
  <h3 class="panel-heading" i18n="@@editor.settings.arrangementHeading">Arrangement</h3>
  <app-arrangement-settings-section
    [mode]="settings().mode"
    [photoCount]="photoCount()"
    (openArrangement)="openArrangement.emit($event)"
    (rearrangeAgain)="rearrangeAgain.emit()"
  />
</section>
