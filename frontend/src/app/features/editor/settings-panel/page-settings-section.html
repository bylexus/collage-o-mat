<mat-form-field subscriptSizing="dynamic">
  <mat-label i18n="@@editor.settings.pageSize">Page size</mat-label>
  <mat-select [formControl]="form.controls.preset" (selectionChange)="commit()">
    @for (preset of presets; track preset.id) {
      <mat-option [value]="preset.id">{{ preset.label }}</mat-option>
    }
    <mat-option value="Custom">{{ customPresetLabel }}</mat-option>
  </mat-select>
</mat-form-field>

@if (showOrientation()) {
  <mat-button-toggle-group
    [formControl]="form.controls.orientation"
    (change)="commit()"
    hideSingleSelectionIndicator
    i18n-aria-label="@@editor.settings.orientation"
    aria-label="Orientation"
  >
    <mat-button-toggle value="portrait" i18n="@@editor.settings.portrait"
      >Portrait</mat-button-toggle
    >
    <mat-button-toggle value="landscape" i18n="@@editor.settings.landscape">
      Landscape
    </mat-button-toggle>
  </mat-button-toggle-group>
}

@if (pageForm.isCustom()) {
  <div class="field-row">
    <app-number-field
      [control]="form.controls.widthMm"
      [limits]="limits.pageSide"
      i18n-label="@@editor.settings.widthMm"
      label="Width (mm)"
      (committed)="commit()"
    />
    <app-number-field
      [control]="form.controls.heightMm"
      [limits]="limits.pageSide"
      i18n-label="@@editor.settings.heightMm"
      label="Height (mm)"
      (committed)="commit()"
    />
  </div>
}

<app-number-field
  [control]="form.controls.dpi"
  [limits]="limits.dpi"
  i18n-label="@@editor.settings.dpi"
  label="Resolution (DPI)"
  (committed)="commit()"
/>

<p class="settings-note" i18n="@@editor.settings.exportSize">
  Export size: {{ exportSize().width }} × {{ exportSize().height }} px
</p>
