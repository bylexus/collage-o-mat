<mat-form-field subscriptSizing="dynamic">
  <mat-label i18n="@@editor.settings.mode">Mode</mat-label>
  <mat-select [formControl]="form.controls.mode" (selectionChange)="requestMode()">
    <mat-option value="grid" i18n="@@editor.settings.modeGrid">Grid</mat-option>
    <mat-option value="center" i18n="@@editor.settings.modeCenter">Center</mat-option>
    <mat-option value="heap" i18n="@@editor.settings.modeHeap">Random heap</mat-option>
  </mat-select>
</mat-form-field>

<div class="rearrange-row">
  <button
    matButton="filled"
    type="button"
    class="rearrange-button"
    [disabled]="!canRearrange()"
    (click)="openArrangement.emit(mode())"
  >
    <mat-icon>auto_awesome_mosaic</mat-icon>
    <span i18n="@@editor.settings.rearrangeDialog">Re-arrange…</span>
  </button>
  <button
    matIconButton
    type="button"
    [disabled]="!canRearrange()"
    (click)="rearrangeAgain.emit()"
    i18n-aria-label="@@editor.settings.rearrangeAgain"
    aria-label="Re-arrange again with the same settings"
    i18n-matTooltip="@@editor.settings.rearrangeAgain"
    matTooltip="Re-arrange again with the same settings"
  >
    <mat-icon>refresh</mat-icon>
  </button>
</div>
<p class="settings-note" i18n="@@editor.settings.rearrangeHint">
  Re-arranging places all photos again and overwrites manual changes.
</p>
