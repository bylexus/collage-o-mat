<h3 class="panel-heading" i18n="@@editor.toolbar.border">Border</h3>

<mat-checkbox
  [formControl]="form.controls.useDefault"
  (change)="commitUseDefault()"
  i18n="@@editor.photo.useDefaultBorder"
>
  Use collage default border
</mat-checkbox>
@if (useDefault()) {
  <p class="settings-note" i18n="@@editor.photo.useDefaultBorderHint">
    The photo has the default border of the collage (see Appearance).
  </p>
} @else {
  <app-border-fields
    [group]="form.controls.border"
    [lengthUnit]="lengthUnit()"
    (colorPreview)="previewColor($event)"
    (committed)="commitBorder()"
  />
}
