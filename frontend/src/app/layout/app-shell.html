<mat-toolbar class="app-toolbar">
  <span i18n="@@appName">Collage-o-mat</span>
  @if (auth.currentUser(); as user) {
    <nav class="toolbar-nav">
      <a matButton routerLink="/collages" routerLinkActive="active-link" i18n="@@toolbar.collages">
        Collages
      </a>
      <a
        matButton
        routerLink="/settings/connectors"
        routerLinkActive="active-link"
        i18n="@@toolbar.connectors"
      >
        Connectors
      </a>
    </nav>
    <span class="toolbar-spacer"></span>
    <a
      matIconButton
      routerLink="/about"
      routerLinkActive="active-link"
      i18n-aria-label="@@toolbar.about"
      aria-label="About"
      i18n-matTooltip="@@toolbar.about"
      matTooltip="About"
    >
      <mat-icon>info</mat-icon>
    </a>
    <button
      matIconButton
      type="button"
      [matMenuTriggerFor]="profileMenu"
      i18n-aria-label="@@toolbar.profileMenu"
      aria-label="Profile menu"
      [matTooltip]="user.username"
    >
      <app-user-avatar [user]="user" [size]="32" />
    </button>
    <mat-menu #profileMenu="matMenu" xPosition="before">
      <div class="profile-menu-header" role="presentation">
        <span class="profile-menu-name">{{ user.username }}</span>
        @if (user.isAdmin) {
          <span class="admin-badge" i18n="@@toolbar.adminBadge">Admin</span>
        }
      </div>
      <mat-divider />
      <a mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span i18n="@@toolbar.profile">Profile</span>
      </a>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span i18n="@@toolbar.logout">Log out</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
